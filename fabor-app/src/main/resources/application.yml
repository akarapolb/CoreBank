spring:
  # OIDC mode (default): set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI (or ..._JWK_SET_URI).
  # With neither set there is no JwtDecoder and the app refuses to start: it never runs unauthenticated.
  flyway:
    enabled: false
  application:
    name: fabor-app
  datasource:
    url: ${FABOR_DB_URL:jdbc:postgresql://localhost:5432/fabor}
    username: ${FABOR_DB_USER:postgres}
    password: ${FABOR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 32
  jackson:
    default-property-inclusion: non_null

server:
  port: ${FABOR_HTTP_PORT:8080}

management:
  server:
    port: ${FABOR_MGMT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

fabor:
  tenant: ${FABOR_TENANT:bank-a}
  auth-mode: ${FABOR_AUTH_MODE:oidc}
  api-token: ${FABOR_API_TOKEN:}
  master-key: ${FABOR_MASTER_KEY:}
  key-provider: ${FABOR_KEY_PROVIDER:config}
  openbao-url: ${FABOR_OPENBAO_URL:}
  openbao-token: ${FABOR_OPENBAO_TOKEN:}
  openbao-mount: ${FABOR_OPENBAO_MOUNT:secret}
  grpc-port: ${FABOR_GRPC_PORT:9090}
  group-commit: ${FABOR_GROUP_COMMIT:true}
  scheduler-enabled: ${FABOR_SCHEDULER:true}
  console:
    client-id: ${FABOR_CONSOLE_CLIENT_ID:}
    app-client-id: ${FABOR_APP_CLIENT_ID:fabor-app}
    authorization-endpoint: ${FABOR_CONSOLE_AUTHORIZE_URL:}
    token-endpoint: ${FABOR_CONSOLE_TOKEN_URL:}
