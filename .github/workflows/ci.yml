name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: fabor
          APP_USER_PASSWORD: fabor
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit, property and architecture tests
        env:
          FABOR_PG_URL: jdbc:postgresql://localhost:5432/fabor
          FABOR_PG_USER: postgres
          FABOR_PG_PASSWORD: postgres
          FABOR_ORA_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          FABOR_ORA_USER: fabor
          FABOR_ORA_PASSWORD: fabor
        run: mvn -B -ntp verify
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        run: |
          for c in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B $c | grep -q '^Signed-off-by:' || { echo "Missing Signed-off-by on $c"; exit 1; }
          done

  web:
    # The React console (ADR-0011): types, unit tests and the production build. The API client is generated from the
    # committed openapi.json; regenerating it against a running app and diffing is a later step.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @fabor/console build

  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Licence allowlist (ADR-0006)
        run: scripts/licence-gate.sh
      - name: SBOM
        run: mvn -B -ntp package -DskipTests
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: target/bom.json }
      - name: ORT analyzer (full licence and policy analysis)
        uses: oss-review-toolkit/ort-ci-github-action@v1
        with:
          run: >
            cache-dependencies,
            analyzer,
            evaluator,
            report
